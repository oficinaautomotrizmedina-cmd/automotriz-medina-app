      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function cloudSync() {
      if (window.AM_CLOUD_SYNC) return window.AM_CLOUD_SYNC;
      try {
        if (window.parent && window.parent !== window && window.parent.AM_CLOUD_SYNC) {
          return window.parent.AM_CLOUD_SYNC;
        }
      } catch {}
      return null;
    }

    async function writeWorkbookToHandle(handle, html) {
      const writable = await handle.createWritable();
      await writable.write(new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' }));
      await writable.close();
    }

    async function saveExcel() {
      if (!validateRequiredVehicleFields()) return false;
      const saveButton = $('saveFile');
      if (saveButton) saveButton.disabled = true;
      persistArchiveSnapshot('Archivo rapido guardado internamente');
      updateFileStatus('Guardando y confirmando en nube...');
      try {
        const cloud = cloudSync();
        if (!cloud?.isReady?.()) throw new Error('La nube no esta disponible.');
        const expectedKey = archiveNorm(currentArchiveKey());
        const expectedArchive = expectedKey ? archiveStore()[expectedKey] : null;
        const fixedSnapshot = cloud.snapshot ? cloud.snapshot() : null;
        await cloud.saveNow('archivo-empleado-confirmado', fixedSnapshot);
        let confirmed = false;
        for (let attempt = 0; attempt < 10; attempt += 1) {
          updateFileStatus(`Confirmando respaldo en nube (${attempt + 1}/10)...`);
          const snapshot = await cloud.fetchLatest?.();
          const archived = expectedKey && snapshot?.archives?.quick?.[expectedKey];
          if (archived && expectedArchive && String(archived.updatedAt || '') === String(expectedArchive.updatedAt || '')) {
            cloud.applySnapshot?.(snapshot);
            confirmed = true;
            break;
          }
          await new Promise(resolve => setTimeout(resolve, 1200 + attempt * 650));
        }
        if (!confirmed) throw new Error('El servidor respondio, pero no confirmo el archivo recien guardado.');
        isDirty = false;
        lastSavedAt = new Date();
        updateFileStatus(`Guardado confirmado: ${saveTimeLabel(lastSavedAt)}`);
        try {
          window.parent?.postMessage?.({
            type: 'am-employee-archive-saved',
            source: 'employee-quick-archive',
            rec: archiveReception || currentArchiveKey(),
            vehicle: getData(),
            savedAt: lastSavedAt.toISOString()
          }, '*');
        } catch (notifyError) {
          console.warn('No se pudo avisar al modulo principal que el archivo fue guardado', notifyError);
        }
        toast('Archivo guardado y confirmado');
        return true;
      } catch (error) {
        console.error(error);
        updateFileStatus('No se pudo confirmar el guardado en nube');
        alert('No se pudo confirmar el archivo en nube: ' + (error && error.message ? error.message : error));
        return false;
      } finally {
        if (saveButton) saveButton.disabled = false;
      }
    }

    async function loadExcel(file, handle = null) {
      const raw = await file.text();
      let data = null;
      if (/\.json$/i.test(file.name)) {
        data = JSON.parse(raw);
      } else {
        const doc = new DOMParser().parseFromString(raw, 'text/html');
        const pre = doc.querySelector('#expediente-json');
        if (pre && pre.textContent.trim()) data = JSON.parse(pre.textContent);
        if (!data) {
          const rows = Array.from(doc.querySelectorAll('table tr'));
          const extracted = { items: [] };
          rows.forEach(row => {
            const cells = Array.from(row.children).map(cell => (cell.textContent || '').trim());
            if (cells.length === 2 && cells[0]) extracted[cells[0]] = cells[1];
          });
          data = normalizeLoadedData(extracted);
        }
      }
      if (!data) throw new Error('Este archivo no fue generado por el modulo de empleados.');
      setData(data);
      setFileHandle(handle);
      isDirty = false;
      lastSavedAt = null;
      updateFileStatus('Expediente cargado');
      persistArchiveSnapshot('Archivo rápido cargado y guardado internamente');
      toast('Expediente cargado');
    }

    function isSupportedLoadFile(file) {
      return !!file && /\.(xls|html|json)$/i.test(file.name || '');
    }

    async function loadDroppedFile(file) {
      if (!isSupportedLoadFile(file)) {
        alert('Solo se pueden cargar archivos .xls, .html o .json.');
        return;
      }
      if (hasPendingChanges() && !confirm('Hay cambios sin guardar. Si cargas otro expediente se reemplazara la informacion actual. Deseas continuar?')) {
        return;
      }
      try {
        await loadExcel(file, null);
        updateFileStatus('Expediente cargado por arrastre');
      } catch (err) {
        alert('No se pudo abrir el expediente: ' + (err && err.message ? err.message : err));
      }
    }

    function setupDropZone() {
      const zone = $('dropZone');
      if (!zone) return;
      const stop = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
      };
      ['dragenter', 'dragover'].forEach(type => zone.addEventListener(type, ev => {
        stop(ev);
        zone.classList.add('drag-over');
      }));
      ['dragleave', 'drop'].forEach(type => zone.addEventListener(type, ev => {
        stop(ev);
        zone.classList.remove('drag-over');
      }));
      zone.addEventListener('drop', ev => {
        const file = ev.dataTransfer && ev.dataTransfer.files ? ev.dataTransfer.files[0] : null;
        loadDroppedFile(file);
      });
      zone.addEventListener('click', openExcel);
    }

    async function openExcel() {
      if (window.showOpenFilePicker) {
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            startIn: 'desktop',
            types: [{ description: 'Expediente Excel', accept: { 'application/vnd.ms-excel': ['.xls'], 'text/html': ['.html'], 'application/json': ['.json'] } }]
          });
          const file = await handle.getFile();
          await loadExcel(file, handle);
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
          alert('No se pudo abrir el archivo: ' + (e && e.message ? e.message : e));
          return;
        }
      }
      $('loadFile').click();
    }

    async function loadCurrentArchive() {
      if (hasPendingChanges() && !confirm('Hay cambios sin guardar. Si cargas el expediente se reemplazara la informacion actual. Deseas continuar?')) return;
      const loadButton = $('loadCloudFile');
      if (loadButton) loadButton.disabled = true;
      updateFileStatus('Cargando expediente...');
      try {
        const cloud = cloudSync();
        if (cloud?.ready) await cloud.ready();
        if (cloud?.fetchLatest) {
          const snapshot = await cloud.fetchLatest();
          cloud.applySnapshot?.(snapshot);
        }
        const savedQuickArchive = persistedArchive();
        if (savedQuickArchive?.data) {
          setData(savedQuickArchive.data);
          lastSavedAt = savedQuickArchive.updatedAt ? new Date(savedQuickArchive.updatedAt) : null;
          isDirty = false;
          updateFileStatus('Expediente cargado');
          toast('Expediente cargado');
          return;
        }
        await openExcel();
      } catch (error) {
        alert('No se pudo cargar el expediente: ' + (error && error.message ? error.message : error));
        updateFileStatus('No se pudo cargar el expediente');
      } finally {
        if (loadButton) loadButton.disabled = false;
      }
    }

    document.querySelectorAll('.nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        $(btn.dataset.section).classList.add('active');
        if (btn.dataset.section === 'autorizado') refreshAutorizado();
      });
    });
    document.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => printDoc(btn.dataset.print)));
    document.querySelectorAll('[data-add-rows]').forEach(btn => btn.addEventListener('click', () => addSheetRows(btn.dataset.addRows)));
    fields.forEach(id => {
      const el = $(id);
      if (!el) return;
      const handler = () => {
        if (uppercaseVehicleFields.includes(id)) forceUppercaseInput(el);
        if (requiredVehicleFields.includes(id) && text(el.value).trim()) el.classList.remove('required-missing');
        renderAndMarkDirty();
      };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });
    $('printRepuestos')?.addEventListener('change', markDirty);
    $('printAuthRepuestos')?.addEventListener('change', markDirty);
    $('itemTipo')?.addEventListener('change', toggleSuggestionInputs);
    $('authItemTipo')?.addEventListener('change', () => toggleSuggestionInputs('auth'));
    $('addItem')?.addEventListener('click', addItem);
    $('addAuthItem')?.addEventListener('click', addAuthorizedItem);
    $('autoFillVehicleBtn')?.addEventListener('click', autoFillVehicleFromEmployeeModule);
    $('itemDesc')?.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addItem(); } });
    $('authItemDesc')?.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addAuthorizedItem(); } });
    $('newFile').addEventListener('click', () => { if (confirm('Esta acción borrará todo el expediente interno actual. ¿Desea continuar?')) { setData(blankData()); setFileHandle(null); isDirty = false; lastSavedAt = null; updateFileStatus('Expediente interno reiniciado'); persistArchiveSnapshot('Expediente interno reiniciado'); } });
    $('loadCloudFile')?.addEventListener('click', loadCurrentArchive);
    $('saveFile').addEventListener('click', saveExcel);
    $('loadFile')?.addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        await loadExcel(file, null);
      } catch (err) {
        alert('No se pudo abrir el expediente: ' + (err && err.message ? err.message : err));
      } finally {
        event.target.value = '';
      }
    });
    document.addEventListener('mousedown', event => {
      const cell = excelCellFrom(event.target);
      if (!cell || cell.classList.contains('excel-editing-cell')) return;
      if (event.button !== 0) return;
      event.preventDefault();
      setSelectedExcelCell(cell);
      cell.focus({ preventScroll: true });
    }, true);
    document.addEventListener('dblclick', event => {
      const cell = excelCellFrom(event.target);
      if (!cell) return;
      event.preventDefault();
      beginExcelEdit(cell, false);
      collapseDoubleClickSelection(cell);
    }, true);
    document.addEventListener('contextmenu', event => {
      const cell = excelCellFrom(event.target);
      if (cell && !cell.classList.contains('excel-editing-cell')) beginExcelEdit(cell, false);
    }, true);
    document.addEventListener('blur', event => {
      const cell = excelCellFrom(event.target);
      if (!cell) return;
      const next = event.relatedTarget;
      if (next && cell.contains(next)) return;
      setTimeout(() => {
        if (!cell.contains(document.activeElement)) commitExcelEdit(cell);
      }, 0);
    }, true);
    document.addEventListener('focusin', event => {
      if (event.target.matches?.('input, textarea')) enableNativeSpellcheck(document);
    });
    window.addEventListener('beforeunload', preventUnsafeUnload);
    window.addEventListener('keydown', preventKeyboardRefresh, true);

    window.updateItem = updateItem;
    window.editItem = editItem;
    window.cancelEdit = cancelEdit;
    window.saveEdit = saveEdit;
    window.removeItem = removeItem;
    function bootstrapArchiveModule() {
      setData(blankDataFromVehicle());
      isDirty = false;
      lastSavedAt = null;
      updateFileStatus('Archivo listo. Presione Cargar para leer lo guardado o Guardar para escribir cambios.');
      toggleSuggestionInputs();
      toggleSuggestionInputs('auth');
      setFileHandle(null);
    }
    bootstrapArchiveModule();
  </script>
